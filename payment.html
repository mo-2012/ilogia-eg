<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حالة الدفع — ilogia</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--ivory:#faf7ef;--navy:#14264a;--lime:#a6d608;--ok:#1f9d55;--bad:#d64545;--wait:#e0a100;--mut:#5c6783}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#eef4d3 0,transparent 45%),var(--ivory);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--navy);padding:20px}
.card{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:40px 28px 32px;text-align:center;box-shadow:0 20px 60px rgba(20,38,74,.12);animation:up .5s ease both}
.brand{font-weight:700;letter-spacing:.3px;color:var(--navy);text-decoration:none;display:inline-block;margin-bottom:22px;font-size:20px}
.ico{width:112px;height:112px;margin:0 auto 22px;display:block}
.ring{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;transform:rotate(-90deg);transform-origin:50% 50%}
.mark{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80}
[data-s=success] .ring,[data-s=success] .mark{stroke:var(--ok)}[data-s=fail] .ring,[data-s=fail] .mark{stroke:var(--bad)}[data-s=pending] .ring,[data-s=pending] .mark{stroke:var(--wait)}
[data-s=success] .fill{fill:var(--ok)}[data-s=fail] .fill{fill:var(--bad)}[data-s=pending] .fill{fill:var(--wait)}
.fill{opacity:0;transform-origin:50% 50%}
.go .ring{animation:draw .7s ease forwards}.go .fill{animation:pop .5s .55s ease forwards;opacity:.1}.go .mark{animation:draw .45s .6s ease forwards}.go .mark2{animation-delay:.8s}
.spin{width:112px;height:112px;margin:0 auto 22px;border-radius:50%;border:6px solid #e6e9f2;border-top-color:var(--navy);animation:rot 1s linear infinite}
h1{font-size:24px;margin:0 0 10px}p{margin:0 0 6px;color:var(--mut);line-height:1.8;font-size:15px}
.plan{display:inline-block;margin:14px 0 4px;padding:8px 18px;background:#f3f8dc;border:1px solid #dbe9a0;border-radius:999px;font-weight:600;font-size:15px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;padding:13px 26px;border-radius:14px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:15px;font-family:inherit}
.btn.g{background:transparent;color:var(--navy);border:1.5px solid #cfd5e6}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}to{transform:scale(1);opacity:.1}}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(16px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>
<body><main class="card" id="card" aria-live="polite">
<a class="brand" href="/index.html">ilogia</a>
<div id="icon"></div><h1 id="t"></h1><p id="d"></p><div id="plan"></div><div class="acts" id="a"></div>
</main>
<script type="module">
import {supabase as sb} from '/supabase.js';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seg=location.pathname.replace(/\/+$/,'').split('/').pop().replace('.html','');
const route=['success','pending','fail'].includes(seg)?seg:'success';
const inv=new URLSearchParams(location.search).get('intent_key');
const svg=(m)=>`<svg class="ico go" viewBox="0 0 112 112" aria-hidden="true"><circle class="fill" cx="56" cy="56" r="48"/><circle class="ring" cx="56" cy="56" r="48"/>${m}</svg>`;
const MARK={success:'<path class="mark" d="M34 58l16 16 29-33"/>',fail:'<path class="mark" d="M40 40l32 32"/><path class="mark mark2" d="M72 40L40 72"/>',pending:'<path class="mark" d="M56 34v24l16 10"/>'};
const btn=(h,t,g)=>`<a class="btn ${g?'g':''}" href="${h}">${t}</a>`;
function show(s,t,d,acts,plan){document.title=t+' — ilogia';$('#card').dataset.s=s;
  $('#icon').innerHTML=s==='verify'?'<div class="spin" role="status"></div>':svg(MARK[s]);
  $('#t').textContent=t;$('#d').textContent=d;$('#plan').innerHTML=plan?`<span class="plan">${esc(plan)}</span>`:'';$('#a').innerHTML=acts||''}
async function latest(){const {data:{session}}=await sb.auth.getSession();if(!session)return {noauth:true};
  let q=sb.from('subscriptions').select('id,status,payment_status,expires_at,fawaterk_intent_key,plan:plans(name)').eq('payment_method','fawaterk').order('id',{ascending:false}).limit(1);
  if(inv)q=q.eq('fawaterk_intent_key',inv);const {data}=await q;return {sub:data?.[0]}}
const ok=(sub)=>show('success','تم الدفع وتفعيل اشتراكك 🎉','أهلاً بيك! كل الدروس والملفات المدفوعة بقت متاحة لك دلوقتي.',btn('/index.html#videos','ابدأ المذاكرة')+btn('/profile.html','حسابي',1),sub?.plan?.name);
const noauth=()=>show('pending','سجّل الدخول الأول','سجّل دخولك بنفس الحساب اللي دفعت منه عشان نعرض حالة اشتراكك.',btn('/login.html','تسجيل الدخول'));
if(route==='fail'){show('fail','الدفع ماتمش','العملية اتلغت أو البنك رفضها، ومتم خصم أي مبلغ. تقدر تجرب تاني بكارت أو وسيلة دفع تانية.',btn('/index.html#plans','جرّب تاني')+btn('/index.html','الرئيسية',1))}
else if(route==='pending'){
  const r=await latest();if(r.sub?.status==='active')ok(r.sub);else
  show('pending','طلب الدفع بانتظارك','لو اخترت فوري أو أمان أو مصاري: ادفع بالكود اللي ظهرلك، وهيتفعل اشتراكك تلقائيًا أول ما الدفع يتأكد (قد ياخد دقائق).',btn('/index.html','الرئيسية')+btn('/profile.html','حسابي',1))}
else{
  show('verify','بنأكد الدفع…','لحظات ونفعّل اشتراكك. متقفلش الصفحة.');
  let done=false;
  for(let i=0;i<30&&!done;i++){const r=await latest();
    if(r.noauth){noauth();done=true;break}
    if(r.sub?.status==='active'){ok(r.sub);done=true;break}
    if(r.sub?.status==='rejected'){show('fail','الدفع ماتأكدش','اتواصل معانا لو اتخصم منك مبلغ.',btn('/index.html#plans','جرّب تاني'));done=true;break}
    await new Promise(r=>setTimeout(r,3000))}
  if(!done)show('pending','وصلنا دفعك ✅','التفعيل بياخد وقت أطول من المعتاد. هيتفعل تلقائيًا، ولو اتأخر أكتر من ساعة ابعتلنا على ilearnweb50@gmail.com.',btn('/index.html','الرئيسية')+btn('/profile.html','حسابي',1))
}
</script></body></html>
