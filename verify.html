<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التحقق من شهادة — ilogia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EC;--ink:#16193A;--navy:#1C2656;--blue:#2E3E7E;--lime:#A4CE3A;--card:#fff;--mut:#4B5070;--ok:#EAF3D5;--okb:#5F7E12;--bad:#FBE4E4;--badb:#8E2323}
@media(prefers-color-scheme:dark){:root{--bg:#12142B;--ink:#EDEBE2;--card:#1B1F3D;--mut:#AEB3D6;--ok:#233014;--bad:#3A1818}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.7 Cairo,system-ui,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;border-bottom:2px solid var(--navy)}
header a.brand{display:flex;align-items:center;gap:.5rem;color:var(--blue);font-weight:800;font-size:1.5rem;text-decoration:none}
header img{block-size:36px}
.btn{font:inherit;font-weight:700;padding:.45rem 1.1rem;border:2px solid var(--navy);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--lime);text-decoration:none}
.btn.p{background:var(--blue);color:#fff}
main{max-inline-size:1100px;margin:auto;padding:1rem}
.search{display:flex;gap:.6rem;border:2px solid var(--navy);border-radius:16px;padding:.7rem;background:var(--card)}
.search input{flex:1;min-inline-size:0;font:700 1rem Cairo,sans-serif;letter-spacing:.04em;padding:.5rem .9rem;border:2px solid var(--navy);border-radius:12px;background:var(--card);color:var(--ink);direction:ltr}
#st{margin-block:1rem;padding:.8rem 1.1rem;border:2px solid;border-radius:14px;display:none;gap:.8rem;align-items:center}
#st.ok{display:flex;background:var(--ok);border-color:var(--okb)}#st.bad{display:flex;background:var(--bad);border-color:var(--badb)}
#st b{display:block;font-size:1.05rem}#st span{font-size:.9rem;color:var(--mut)}
.acts{display:none;flex-wrap:wrap;gap:.6rem;margin-block-end:1rem}.acts.on{display:flex}
#stage{background:var(--card);border-radius:12px;padding:1rem;box-shadow:0 6px 30px #0002;overflow:hidden;display:none}#stage.on{display:block}
#scaler{transform-origin:top right;inline-size:1123px;block-size:794px}
#msg{min-block-size:1.5rem;color:var(--mut)}
/* ----- certificate (fixed 1123x794 = A4 landscape @96dpi) ----- */
.cert{position:relative;inline-size:1123px;block-size:794px;background:#FFFEF9;color:#16193A;font-family:Cairo,system-ui,sans-serif;direction:rtl;overflow:hidden}
.cert .grid{position:absolute;inset:0;background-image:linear-gradient(#16193A0A 1px,transparent 1px),linear-gradient(90deg,#16193A0A 1px,transparent 1px);background-size:24px 24px}
.cert .f1{position:absolute;inset:22px;border:7px solid #1C2656}.cert .f2{position:absolute;inset:40px;border:2px solid #A4CE3A}
.cert .corner{position:absolute;inline-size:70px;block-size:70px;display:block}
.cert .c1{top:22px;right:22px}.cert .c2{bottom:22px;left:22px}.cert .c3{top:22px;left:22px}.cert .c4{bottom:22px;right:22px}
.cert .t{position:absolute;inset-inline:0;text-align:center}
.cert .logo{top:52px;display:flex;justify-content:center;align-items:center;gap:12px;direction:ltr;color:#2E3E7E;font:800 52px Cairo,sans-serif}.cert .logo img{block-size:60px}
.cert .h1{top:118px;font:800 60px/1.3 Cairo,sans-serif;color:#1C2656}
.cert .s1{top:200px;font-size:20px;color:#4B5070}
.cert .nm{top:238px;font:800 62px/1.4 Cairo,sans-serif;color:#2E3E7E}
.cert .ul{position:absolute;top:318px;left:50%;transform:translateX(-50%);inline-size:640px;block-size:6px;background:#A4CE3A}
.cert .s2{top:340px;font-size:22px;color:#4B5070}
.cert .sb{top:376px;font:800 40px/1.4 Cairo,sans-serif;color:#1C2656}
.cert .s3{top:432px;font-size:22px;color:#4B5070}
.cert .boxes{position:absolute;top:478px;inset-inline:0;display:flex;justify-content:center;gap:34px;direction:rtl}
.cert .box{inline-size:230px;padding:12px 8px;border:3px solid #1C2656;border-radius:18px;text-align:center;background:#fff}
.cert .box b{display:block;font:800 26px/1.5 Cairo,sans-serif;color:#1C2656}.cert .box span{font-size:16px;color:#4B5070}
.cert .qr{position:absolute;bottom:58px;left:80px;display:flex;gap:12px;align-items:center;direction:rtl}
.cert .qr img{inline-size:112px;block-size:112px}.cert .qr p{margin:0;font-size:14px;line-height:1.9;color:#4B5070;max-inline-size:190px;text-align:right}.cert .qr p b{color:#1C2656;font-size:15px}
.cert .sig{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);inline-size:260px;text-align:center}
.cert .seal{inline-size:100px;block-size:100px;margin:0 auto 8px;border-radius:50%;background:#A4CE3A;border:4px double #16193A;display:grid;place-items:center;font:800 20px Cairo,sans-serif;color:#16193A}
.cert .sig i{display:block;block-size:2px;background:#1C2656;margin-block:6px}.cert .sig span{font-size:17px;color:#1C2656}
.cert .sn{position:absolute;bottom:64px;right:80px;text-align:right}.cert .sn span{display:block;font-size:15px;color:#4B5070}.cert .sn b{font:800 24px Cairo,sans-serif;color:#1C2656;direction:ltr;display:inline-block;letter-spacing:.04em}
.cert .rev{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:8px solid #B02A2A;color:#B02A2A;font:800 110px Cairo,sans-serif;padding:0 40px;border-radius:20px;opacity:.55}
@media print{@page{size:A4 landscape;margin:0}body{background:#fff}header,main>*:not(#stage),#stage{box-shadow:none}header,.search,#st,.acts,#msg{display:none!important}#stage{padding:0;display:block}#scaler{transform:none!important}}
@media(max-width:560px){.search{flex-wrap:wrap}.search .btn{inline-size:100%}}
</style>
</head>
<body>
<header><a class="btn" href="/">الرئيسية</a><a class="brand" href="/"><span>ilogia</span><img src="logo-mark.png" alt=""></a></header>
<main>
  <form class="search" id="f"><input id="q" placeholder="ILG-2026-XXXXXXXXXXXX" autocomplete="off" spellcheck="false" aria-label="رقم الشهادة"><button class="btn p" type="submit">تحقّق من الشهادة</button></form>
  <div id="st" role="status"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" id="ic"></svg><div><b id="stT"></b><span id="stS"></span></div></div>
  <div class="acts" id="acts"><button class="btn p" id="bPdf">تحميل PDF</button><button class="btn" id="bImg">تحميل صورة</button><button class="btn" id="bPrint">طباعة</button><button class="btn" id="bCopy">نسخ رابط التحقق</button></div>
  <p id="msg"></p>
  <div id="stage"><div id="scaler"></div></div>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb=createClient('https://zugwicbbfbefbbwugfxq.supabase.co','sb_publishable_34jNpaqwtFeYboTVgO-mYw_efc0T-Ew',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=s=>document.querySelector(s),AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};   // textContent only: names are user data
const hoursText=s=>{s=Math.max(0,Math.round(+s||0));const h=Math.floor(s/3600),m=Math.round(s%3600/60);if(!h&&!m)return 'أقل من دقيقة';if(!h)return AR(m)+' دقيقة';return AR(h)+' ساعة'+(m?' و'+AR(m)+' دقيقة':'')};
const dateText=iso=>AR(new Date(iso).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}));
const verifyUrl=(s,base)=>(base||location.origin).replace(/\/+$/,'')+'/verify?c='+encodeURIComponent(s);
let current=null;
const loadScript=u=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${u}"]`))return res();const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('load '+u));document.head.append(s)});

async function qrSrc(text){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=8,m=2,size=(n+m*2)*cell,cv=document.createElement('canvas');cv.width=cv.height=size;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#16193A';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);return cv.toDataURL('image/png')}

async function buildCert(c){const el=mk('div','cert');el.append(mk('div','grid'),mk('div','f1'),mk('div','f2'));
  [['c1','#1C2656','0,0 70,0 70,70'],['c2','#1C2656','0,0 0,70 70,70'],['c3','#A4CE3A','0,0 70,0 0,70'],['c4','#A4CE3A','70,0 70,70 0,70']].forEach(([k,f,pts])=>{
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','corner '+k);s.setAttribute('viewBox','0 0 70 70');
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('points',pts);p.setAttribute('fill',f);s.append(p);el.append(s)});
  const lg=mk('div','t logo');const im=mk('img');im.src='logo-mark.png';im.alt='';lg.append(mk('span',null,c.site_name||'ilogia'),im);
  const site=c.site_name||'ilogia';
  el.append(lg,mk('div','t h1','شهادة إتمام'),mk('div','t s1','تشهد منصة '+site+' بأن الطالب / الطالبة'),mk('div','t nm',c.student_name),mk('div','ul'),
    mk('div','t s2','قد أتمّ بنجاح دراسة مادة'),mk('div','t sb',c.subject_name),mk('div','t s3',[c.grade_name,c.term].filter(Boolean).join(' — ')));
  const bx=mk('div','boxes');
  [[AR(c.lessons_completed)+' / '+AR(c.lessons_total),'عدد الدروس المنجزة'],[hoursText(c.study_seconds),'ساعات المذاكرة'],[dateText(c.issued_at),'تاريخ الإصدار']].forEach(([a,b])=>{const d=mk('div','box');d.append(mk('b',null,a),mk('span',null,b));bx.append(d)});
  el.append(bx);
  const qr=mk('div','qr'),qi=mk('img');qi.alt='باركود التحقق';qi.src=await qrSrc(verifyUrl(c.serial,c.site_url));
  const qp=mk('p');qp.append(mk('b',null,'تحقّق من صحة الشهادة'),document.createElement('br'),document.createTextNode('امسح الباركود، أو ادخل على '+(c.site_url||location.origin).replace(/^https?:\/\//,'').replace(/\/+$/,'')+'/verify وأدخل رقم الشهادة'));
  qr.append(qi,qp);
  const sg=mk('div','sig');sg.append(mk('div','seal',site),mk('i'),mk('span',null,'إدارة منصة '+site));
  const sn=mk('div','sn');sn.append(mk('span',null,'رقم الشهادة'),mk('b',null,c.serial));
  el.append(qr,sg,sn);if(c.revoked)el.append(mk('div','rev','ملغاة'));
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;return el}

function fit(){const st=$('#stage'),sc=$('#scaler');const cs=getComputedStyle(st),k=Math.min(1,(st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))/1123);
  sc.style.transform=`scale(${k})`;st.style.blockSize=(794*k+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom))+'px'}
addEventListener('resize',fit);

const ICONS={ok:'<circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/>',bad:'<circle cx="12" cy="12" r="10"/><path d="M9 9l6 6M15 9l-6 6"/>'};
function status(kind,t,s){const e=$('#st');e.className=kind;$('#stT').textContent=t;$('#stS').textContent=s||'';$('#ic').innerHTML=ICONS[kind]}
async function check(raw){const serial=String(raw||'').trim().toUpperCase();$('#msg').textContent='';
  $('#acts').classList.remove('on');$('#stage').classList.remove('on');current=null;$('#st').className='';
  if(!/^ILG-\d{4}-[A-Z0-9]{12}$/.test(serial)){status('bad','رقم الشهادة غير صحيح','اكتب الرقم كما هو مطبوع على الشهادة، مثال: ILG-2026-XXXXXXXXXXXX');return}
  $('#msg').textContent='جاري التحقق...';
  let r;try{r=await sb.rpc('verify_certificate',{p_serial:serial})}catch(x){r={error:x}}
  $('#msg').textContent='';
  if(r.error){status('bad','تعذّر التحقق الآن','تأكد من الاتصال بالإنترنت وحاول مرة أخرى');return}
  const c=(r.data||[])[0];if(!c){status('bad','شهادة غير موجودة','لا توجد شهادة بهذا الرقم في سجلات المنصة');return}
  current=c;history.replaceState(null,'','?c='+encodeURIComponent(c.serial));
  if(c.revoked)status('bad','هذه الشهادة ملغاة','تم إلغاؤها من إدارة المنصة ولم تعد صالحة.');
  else status('ok','شهادة موثّقة وصحيحة','صادرة عن منصة '+(c.site_name||'ilogia')+' للطالب: '+c.student_name);
  const sc=$('#scaler');sc.replaceChildren(await buildCert(c));$('#stage').classList.add('on');$('#acts').classList.add('on');fit()}

async function exportCanvas(){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const host=mk('div');host.style.cssText='position:fixed;left:-99999px;top:0';const el=await buildCert(current);host.append(el);document.body.append(host);
  try{return await html2canvas(el,{scale:2,backgroundColor:'#FFFEF9',useCORS:true,width:1123,height:794})}finally{host.remove()}}
const dl=(href,name)=>{const a=document.createElement('a');a.href=href;a.download=name;document.body.append(a);a.click();a.remove()};
const busy=async(b,f)=>{if(!current)return;const t=b.textContent;b.disabled=true;b.textContent='جاري التجهيز...';try{await f()}catch(x){console.error(x);$('#msg').textContent='تعذّر التجهيز، حاول مرة أخرى'}finally{b.disabled=false;b.textContent=t}};
$('#bImg').onclick=e=>busy(e.currentTarget,async()=>{const cv=await exportCanvas();dl(cv.toDataURL('image/png'),'ilogia-certificate-'+current.serial+'.png')});
$('#bPdf').onclick=e=>busy(e.currentTarget,async()=>{const cv=await exportCanvas();await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,297,210);pdf.save('ilogia-certificate-'+current.serial+'.pdf')});
$('#bPrint').onclick=()=>{if(current)print()};
$('#bCopy').onclick=async()=>{if(!current)return;try{await navigator.clipboard.writeText(verifyUrl(current.serial,current.site_url));$('#msg').textContent='تم نسخ رابط التحقق'}catch(x){$('#msg').textContent=verifyUrl(current.serial,current.site_url)}};
$('#f').onsubmit=e=>{e.preventDefault();check($('#q').value)};
const c0=new URLSearchParams(location.search).get('c');if(c0){$('#q').value=c0;check(c0)}
</script>
</body>
</html>
