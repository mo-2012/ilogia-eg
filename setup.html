<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>إعداد حسابك — ilogia</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ilogia-ds.css">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;min-block-size:100vh;display:grid;place-items:center;padding:clamp(16px,4vw,40px);background:var(--ds-ivory);color:var(--ds-ink);font-family:var(--ds-font)}
.wrap{inline-size:100%;max-inline-size:480px}
.brand{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-block-end:var(--sp-6);text-decoration:none}
.brand img{block-size:38px;inline-size:auto}
.brand span{font:800 2.1rem/1 'Baloo 2',var(--ds-font);color:var(--ds-navy);direction:ltr}
.box{background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-r-lg);box-shadow:var(--ds-shadow-md);padding:clamp(20px,5vw,32px)}
h1{margin:0 0 var(--sp-2);font-size:var(--fs-24)}
.sub{margin:0 0 var(--sp-6);color:var(--ds-mut);font-size:var(--fs-14);line-height:1.8}
form{display:grid;gap:var(--sp-4)}
label{display:grid;gap:var(--sp-1);font-weight:600;font-size:var(--fs-14)}
.hint{font-weight:400;color:var(--ds-mut);font-size:var(--fs-12)}
input,select{min-block-size:46px;padding:.4rem .9rem;font-size:var(--fs-16);inline-size:100%}
input[readonly]{background:var(--ds-soft)!important;color:var(--ds-mut)!important;direction:ltr;text-align:right}
.fieldmsg{color:var(--ds-err);font-size:var(--fs-14)}.fieldmsg:empty{display:none}
.alert{border-radius:var(--ds-r-sm);padding:.7rem .9rem;font-size:var(--fs-14);line-height:1.8;border:1px solid}
.alert.e{background:var(--ds-err-bg);color:var(--ds-err);border-color:var(--ds-err)}
.alert.i{background:var(--ds-green-t);color:var(--ds-navy);border-color:#BFE3D6}
.alert+*{margin-block-start:var(--sp-4)}
.btn{inline-size:100%}
.lnk{background:none;border:0;padding:.35rem 0;color:var(--ds-green-d);font:600 var(--fs-14) var(--ds-font);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-block-size:44px}
.foot{margin-block-start:var(--sp-4);text-align:center}
.steps{display:flex;gap:var(--sp-2);justify-content:center;margin-block-end:var(--sp-6);font-size:var(--fs-12);color:var(--ds-mut)}
.steps b{display:inline-grid;place-items:center;inline-size:22px;block-size:22px;border-radius:50%;background:var(--ds-green);color:#fff;font-size:var(--fs-12);margin-inline-end:4px}
.steps span.done b{background:var(--ds-ok)}
.load{text-align:center;color:var(--ds-mut);padding:var(--sp-8) 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="index.html" aria-label="ilogia"><img src="logo-mark.png" alt="" width="34" height="38"><span>ilogia</span></a>
  <main class="box">
    <div class="load" id="loading" role="status">جارٍ تجهيز صفحة الإعداد…</div>

    <section id="formView" hidden>
      <div class="steps" aria-hidden="true"><span class="done"><b>✓</b>إنشاء الحساب</span><span class="done"><b>✓</b>تأكيد البريد</span><span><b>٣</b>إعداد الحساب</span></div>
      <h1 id="title" tabindex="-1">أهلًا بك في ilogia</h1>
      <p class="sub">بريدك مؤكَّد. أكمل بيانات حسابك مرة واحدة، ويمكنك تعديلها لاحقًا من «ملفي».</p>
      <div id="notice" role="status" aria-live="polite"></div>
      <form id="form" novalidate>
        <label>البريد الإلكتروني <span class="hint">من حسابك المؤكَّد، ولا يمكن تغييره من هنا</span>
          <input id="email" type="email" readonly tabindex="-1" aria-readonly="true">
        </label>
        <label>الاسم الكامل <span class="hint">هذا الاسم هو الذي سيظهر على شهاداتك، فاكتبه كما تريد</span>
          <input id="name" type="text" autocomplete="name" maxlength="80" required>
        </label>
        <label>الصف الدراسي
          <select id="grade" required><option value="">اختر صفّك…</option></select>
        </label>
        <div class="fieldmsg" id="fmsg" role="alert"></div>
        <button class="btn" id="save" type="submit">حفظ والمتابعة</button>
      </form>
      <p class="foot"><button type="button" class="lnk" id="out">تسجيل الخروج</button></p>
    </section>

    <section id="errView" hidden>
      <h1>تعذّر تحميل الصفحة</h1>
      <p class="sub" id="errText">حدث خطأ أثناء الاتصال بالخادم.</p>
      <button class="btn" id="retry" type="button">إعادة المحاولة</button>
    </section>
  </main>
</div>

<script type="module">
import { $, getClient, safeNext, isVerified, friendly, withTimeout } from './auth-flow.js';

const NEXT = safeNext(new URLSearchParams(location.search).get('next'));
const toLogin = () => location.replace('login.html?next=' + encodeURIComponent(NEXT));
let sb = null, user = null;

const show = (id) => { for (const v of ['loading', 'formView', 'errView']) $('#' + v).hidden = v !== id; };
const notice = (kind, text) => { const el = $('#notice'); el.replaceChildren(); if (!text) return; const d = document.createElement('div'); d.className = 'alert ' + kind; d.textContent = text; el.append(d); };

async function boot() {
  show('loading');
  sb = sb || await getClient();
  if (!sb) { $('#errText').textContent = 'تعذّر الاتصال بالخادم. تحقّق من الإنترنت ثم أعد المحاولة.'; return show('errView'); }
  let session = null;
  try { session = (await withTimeout(sb.auth.getSession(), 15000)).data.session; } catch (e) { console.warn(e); }
  if (!session) return toLogin();                       // no session -> back to the login page
  user = session.user;
  if (!isVerified(user)) { try { await sb.auth.signOut(); } catch (e) { console.warn(e); } return toLogin(); }

  try {
    const [p, g] = await withTimeout(Promise.all([
      sb.from('profiles').select('full_name,grade_id,onboarded_at').eq('id', user.id).maybeSingle(),
      sb.from('grades').select('id,name,sort_order').order('sort_order'),
    ]), 20000);
    if (g.error) throw g.error;
    const meta = user.user_metadata || {};
    // Where the pre-filled name comes from: the saved profile, otherwise what you typed at sign-up / your Google account.
    $('#name').value = (p.data?.full_name || meta.full_name || meta.name || '').trim();
    $('#email').value = user.email || '';
    const sel = $('#grade'); sel.length = 1;
    for (const x of g.data || []) { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; sel.append(o); }
    if (p.data?.grade_id) sel.value = String(p.data.grade_id);
    if (!(g.data || []).length) notice('e', 'لا توجد صفوف دراسية في قاعدة البيانات بعد. تواصل مع إدارة المنصة.');
    show('formView'); $('#title').focus();
  } catch (e) { $('#errText').textContent = friendly(e); show('errView'); }
}

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#fmsg').textContent = ''; notice('', '');
  const name = $('#name').value.trim().replace(/\s+/g, ' '), grade = +$('#grade').value;
  if (name.length < 3) { $('#name').focus(); return $('#fmsg').textContent = 'اكتب اسمك الكامل (٣ أحرف على الأقل).'; }
  if (!grade) { $('#grade').focus(); return $('#fmsg').textContent = 'اختر صفّك الدراسي.'; }
  const b = $('#save'); b.disabled = true; b.setAttribute('aria-busy', 'true'); b.textContent = 'جارٍ الحفظ…';
  try {
    const r = await withTimeout(sb.rpc('save_my_profile', { p_name: name, p_grade_id: grade }));
    if (r.error) {
      const m = String(r.error.message || '');
      throw (/Could not find the function|PGRST202|schema cache/i.test(m) ? new Error('save_my_profile') : r.error);
    }
    location.replace(NEXT);
  } catch (x) { notice('e', friendly(x)); b.disabled = false; b.removeAttribute('aria-busy'); b.textContent = 'حفظ والمتابعة'; }
});

$('#out').onclick = async () => { try { await sb.auth.signOut(); } catch (e) { console.warn(e); } toLogin(); };
$('#retry').onclick = () => location.reload();   // a failed dynamic import() is cached by the browser, so only a reload can recover
boot();
</script>
</body>
</html>
