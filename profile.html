<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملفي الشخصي — ilogia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{--b:#2E3E7E;--bd:#1C2656;--bm:#344DAA;--l:#A4CE3A;--ld:#5F7E12;--p:#F7F4EC;--c:#FFFDF8;--m:#EDE9DD;--ink:#16193A;--i2:#4A4E6B;--ln:#D9D4C4;--err:#A32D2D;--sf:'Noto Naskh Arabic',serif;--sn:'IBM Plex Sans Arabic',system-ui,sans-serif;--r:14px}
:root[data-theme=dark]{--p:#0F1A2F;--c:#162544;--m:#1E293B;--ink:#E6EAF5;--i2:#9AA7C4;--ln:#334155;--bd:#DCE4FF;--b:#3B4FA8;--bm:#8FA3E8}
[hidden]{display:none!important}*{box-sizing:border-box;margin:0}body{font:400 1rem/1.8 var(--sn);background:var(--p);color:var(--ink);min-block-size:100vh}
:focus-visible{outline:3px solid var(--bm);outline-offset:2px}h1,h2,h3{font-family:var(--sf);color:var(--bd);line-height:1.4}
.w{max-inline-size:1000px;margin-inline:auto;padding-inline:clamp(16px,4vw,28px)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--p) 90%,transparent);backdrop-filter:blur(8px);border-block-end:2px solid var(--bd)}
.bar{display:flex;align-items:center;gap:.8rem;min-block-size:64px}.wm{display:flex;align-items:center;gap:.5rem;text-decoration:none;margin-inline-end:auto}.wm img{block-size:30px}.wm span{font:800 1.8rem/1 'Baloo 2',var(--sn);color:var(--bd);direction:ltr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-block-size:42px;padding:.3rem 1.2rem;border:2px solid var(--bd);border-radius:12px;background:var(--b);color:#fff;font:600 .92rem var(--sn);cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--l);transition:transform .15s,box-shadow .15s}.btn:hover{transform:translate(-2px,2px);box-shadow:1px 1px 0 var(--l)}
.btn.g{background:var(--c);color:var(--bd);box-shadow:3px 3px 0 var(--ln)}.btn.s{min-block-size:38px;padding:.2rem .9rem;font-size:.85rem}.btn[disabled]{opacity:.55;cursor:wait}
main{padding-block:28px 60px;display:grid;gap:1.3rem}
.card{background:var(--c);border:2px solid var(--bd);border-radius:var(--r);padding:1.3rem 1.4rem}.card h2{font-size:1.3rem;margin-block-end:.8rem}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:1.3rem;align-items:center;background:var(--bd);color:#fff;box-shadow:7px 7px 0 var(--l)}.top h1{color:#fff;font-size:clamp(1.5rem,4vw,2.1rem)}.top p{color:#C9D3F5;word-break:break-all}
:root[data-theme=dark] .top{background:var(--b);border-color:#0E1438}
.av{inline-size:96px;block-size:96px;border-radius:50%;display:grid;place-items:center;font-size:3rem;border:4px solid var(--l);background:var(--col,#A4CE3A);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.av:hover{transform:rotate(-8deg) scale(1.06)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-block-start:.5rem}.pill{font-size:.78rem;font-weight:700;border-radius:99px;padding:0 .8rem;background:#EAF3CF;color:var(--ld)}.pill.w2{background:#FFE9B5;color:#7A5B00}.pill.n{background:var(--m);color:var(--i2)}
.streak{text-align:center;background:rgba(255,255,255,.1);border-radius:var(--r);padding:.6rem 1rem}.streak b{display:block;font:700 1.8rem/1.2 var(--sn)}.streak small{color:#C9D3F5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}.stats div{background:var(--m);border-radius:12px;padding:.7rem;text-align:center;font-size:.85rem;color:var(--i2)}.stats b{display:block;font-size:1.35rem;color:var(--bd)}
.ring{display:grid;place-items:center;position:relative;inline-size:140px;margin-inline:auto}.ring svg{inline-size:140px;block-size:140px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}.ring .t{stroke:var(--m)}.ring .v{stroke:var(--l);stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.3,1)}
.ring div{position:absolute;text-align:center;line-height:1.3}.ring b{font:700 1.5rem var(--sn);color:var(--bd);display:block}.ring small{color:var(--i2)}
.week{display:flex;align-items:flex-end;gap:.5rem;block-size:130px;margin-block-start:.6rem}.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;block-size:100%;font-size:.72rem;color:var(--i2)}.week i{display:block;inline-size:100%;max-inline-size:34px;border-radius:8px 8px 3px 3px;background:var(--l);min-block-size:4px;block-size:0;transition:block-size .9s cubic-bezier(.2,.9,.3,1)}.week .td i{background:var(--b)}
.bar2{block-size:12px;border-radius:99px;background:var(--m);overflow:hidden;margin-block:.6rem}.bar2 i{display:block;block-size:100%;background:var(--l);inline-size:0;transition:inline-size 1s cubic-bezier(.2,.9,.3,1)}
form{display:grid;gap:.9rem}label{display:grid;gap:.25rem;font-weight:600;font-size:.9rem}
input,select{min-block-size:44px;padding:.3rem .9rem;border:2px solid var(--bd);border-radius:12px;background:var(--c);font:inherit;color:var(--ink)}
.pick{display:flex;gap:.5rem;flex-wrap:wrap}.pick button{inline-size:46px;block-size:46px;border-radius:50%;border:3px solid transparent;font-size:1.5rem;background:var(--m);cursor:pointer}.pick button[aria-pressed=true]{border-color:var(--bd);background:var(--l)}
.cols button{background:var(--c1);font-size:0}.msg{min-block-size:1.3em;font-size:.9rem}.msg.e{color:var(--err)}.msg.o{color:var(--ld);font-weight:600}
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.7rem}.bd div{text-align:center;padding:.8rem .5rem;border:2px solid var(--ln);border-radius:12px;font-size:.82rem}.bd div.on{border-color:var(--ld);background:#EAF3CF;color:#2B3A08}.bd div:not(.on){filter:grayscale(1);opacity:.55}.bd span{display:block;font-size:1.8rem}
.ls{list-style:none;padding:0;display:grid;gap:.5rem}.ls li{display:flex;gap:.6rem;align-items:center;background:var(--m);border-radius:10px;padding:.5rem .9rem}.ls li:before{content:"✓";color:var(--ld);font-weight:700}
.empty{text-align:center;color:var(--i2);padding:1.2rem;border:2px dashed var(--ln);border-radius:var(--r)}
.gate{text-align:center;padding:3rem 1rem}.gate h1{margin-block-end:.8rem}.gate .btn{margin-block-start:1rem}
@media(max-width:760px){.top{grid-template-columns:auto 1fr}.top .streak{grid-column:1/-1}.g2{grid-template-columns:1fr}}
.up{animation:up .6s cubic-bezier(.2,.9,.3,1) backwards}@keyframes up{from{opacity:0;transform:translateY(18px)}}
.fl{animation:flk 1.1s ease-in-out infinite;transform-origin:50% 90%}@keyframes flk{35%{transform:scale(.94,1.1) rotate(-3deg)}70%{transform:scale(1.05,.95) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="w bar"><a class="wm" href="index.html" aria-label="ilogia"><img src="logo-mark.png" alt="" width="26" height="30"><span>ilogia</span></a>
<button class="btn g s" id="themeBtn" aria-label="تبديل المظهر">🌙</button><a class="btn g s" href="index.html">الرئيسية</a></div></header>
<main class="w" id="app"><div class="empty">جارٍ التحميل…</div></main>

<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const SB_URL='https://zugwicbbfbefbbwugfxq.supabase.co',SB_KEY='sb_publishable_34jNpaqwtFeYboTVgO-mYw_efc0T-Ew';
const LS=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)):localStorage.setItem(k,JSON.stringify(v))}catch(x){return null}};
const T=(p,ms=15000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('TIMEOUT')),ms))]);
const AVS=['🦉','🦊','🐼','🦁','🐯','🐬','🦄','🚀'],COLS=['#A4CE3A','#FFD84A','#8FA3E8','#FF9E7A','#7ED6C4','#E3A8F0'];
const prog=()=>({secs:0,done:[],days:[],by:{},...(LS('el_prog')||{})}),pf=()=>({av:'🦉',col:COLS[0],grade:'',goal:30,...(LS('el_profile')||{})});
const TM=['system','light','dark'],TI={system:'🖥️',light:'☀️',dark:'🌙'};
const theme=m=>{const d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';$('#themeBtn').textContent=TI[m]};
theme(LS('el_theme')||'system');$('#themeBtn').onclick=()=>{const n=TM[(TM.indexOf(LS('el_theme')||'system')+1)%3];LS('el_theme',n);theme(n)};
const dkey=d=>d.toISOString().slice(0,10),mins=s=>Math.floor(s/60);
const streak=p=>{let n=0,d=new Date();while(p.days.includes(dkey(d))){n++;d.setDate(d.getDate()-1)}return n};
const gate=(t,b)=>$('#app').innerHTML=`<div class="card gate"><h1>${t}</h1><p>${b}</p><a class="btn" href="index.html">العودة للرئيسية</a></div>`;
async function loadSb(){for(const u of['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm','https://esm.sh/@supabase/supabase-js@2.45.4']){try{const m=await T(import(u));return m.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(x){console.warn(x)}}return null}
const sb=await loadSb();
if(!sb)gate('تعذّر الاتصال','تحقق من الإنترنت وأعد تحميل الصفحة.');
else{
  let ses=null;try{ses=(await T(sb.auth.getSession())).data.session}catch(x){console.warn(x)}
  if(!ses)gate('سجّل الدخول أولًا','ملفك الشخصي يظهر بعد تسجيل الدخول من الصفحة الرئيسية.');
  else{
    const u=ses.user,meta=u.user_metadata||{};let prof={},sub=null,grades=[],vids=[];
    try{const p=prog();const [a,b,c,d]=await T(Promise.all([sb.from('profiles').select('*').eq('id',u.id).maybeSingle(),sb.from('my_subscription').select('*').maybeSingle(),sb.from('grades').select('*').order('sort_order'),p.done.length?sb.from('videos').select('id,title,subject:subjects(name)').in('id',p.done):Promise.resolve({data:[]})]),20000);
      prof=a.data||{};sub=b.data||null;grades=c.data||[];vids=d.data||[]}catch(x){console.warn('[ilogia profile]',x)}
    draw();
    function draw(){
      const p=prog(),f=pf(),name=prof.full_name||meta.full_name||meta.name||'',t0=dkey(new Date()),tm=mins(p.by[t0]||0),goal=Math.max(5,+f.goal||30),st=streak(p);
      const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return{k:dkey(d),l:d.toLocaleDateString('ar-EG',{weekday:'short'}),m:mins(p.by[dkey(d)]||0)}}),mx=Math.max(30,...days.map(d=>d.m));
      const act=sub?.status==='active',plan=act?`<span class="pill">${esc(sub.plan_name)}</span>`:'<span class="pill n">بدون اشتراك</span>';
      const B=[['📚','أول درس',p.done.length>=1],['🔥','٣ أيام متتالية',st>=3],['⏱️','ساعة مذاكرة',p.secs>=3600],['🏆','١٠ دروس',p.done.length>=10],['🌟','هدف اليوم',tm>=goal]];
      $('#app').innerHTML=`
<section class="card top up"><div class="av" style="--col:${esc(f.col)}" aria-hidden="true">${esc(f.av)}</div>
<div><h1>${esc(name||'طالب ilogia')}</h1><p>${esc(u.email)}</p><div class="chips">${plan}${f.grade?`<span class="pill n">${esc(grades.find(g=>g.id==f.grade)?.name||'')}</span>`:''}${prof.is_platform_admin?'<span class="pill w2">مدير</span>':''}</div></div>
<div class="streak"><svg class="fl" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 1 1.5 2 2 2 1-2 1-5 1-8z" fill="#FF8A3D"/><path d="M12 22a3.5 3.5 0 0 1-3.5-3.5c0-2 2-3 3.5-5 1.5 2 3.5 3 3.5 5A3.5 3.5 0 0 1 12 22z" fill="#FFD84A"/></svg><b>${AR(st)}</b><small>أيام متتالية</small></div></section>
<div class="g2"><section class="card up" style="animation-delay:.08s"><h2>هدف اليوم</h2><div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" id="rv" cx="60" cy="60" r="52"/></svg><div><b>${AR(tm)}</b><small>من ${AR(goal)} د</small></div></div></section>
<section class="card up" style="animation-delay:.14s"><h2>آخر ٧ أيام (بالدقائق)</h2><div class="week">${days.map(d=>`<div class="${d.k===t0?'td':''}"><i data-h="${Math.round(d.m/mx*100)}" title="${AR(d.m)} د"></i>${d.l}</div>`).join('')}</div></section></div>
<section class="card up"><h2>إنجازاتي</h2><div class="stats"><div><b>${AR(p.secs>=3600?Math.floor(p.secs/3600)+'س '+mins(p.secs%3600)+'د':mins(p.secs)+' د')}</b>وقت المذاكرة</div><div><b>${AR(p.done.length)}</b>دروس منجزة</div><div><b>${AR(st)}</b>أيام متتالية</div></div>
<div class="bd" style="margin-block-start:1rem">${B.map(b=>`<div class="${b[2]?'on':''}"><span>${b[0]}</span>${b[1]}</div>`).join('')}</div></section>
<div class="g2"><section class="card up"><h2>اشتراكي</h2>${!sub?'<p>لا يوجد اشتراك حاليًا.</p>':act?`<p><b>${esc(sub.plan_name)}</b> — مفعّل</p>${sub.expires_at?`<div class="bar2"><i data-w="${Math.min(100,Math.round(sub.days_left/30*100))}"></i></div><p>متبقٍ ${AR(sub.days_left)} يومًا</p>`:''}`:sub.status==='pending'?'<p>إيصالك قيد المراجعة.</p>':sub.status==='rejected'?'<p>تم رفض الإيصال الأخير، أرسل إيصالًا جديدًا.</p>':'<p>انتهى اشتراكك السابق.</p>'}<a class="btn s" style="margin-block-start:.8rem" href="index.html#plans">${act?'تجديد / ترقية':'اختر باقة'}</a></section>
<section class="card up"><h2>الدروس التي أنهيتها</h2>${vids.length?`<ul class="ls">${vids.slice(0,8).map(v=>`<li>${esc(v.title)}</li>`).join('')}</ul>`:'<div class="empty">لم تُكمل أي درس بعد. ابدأ من قسم الدروس.</div>'}</section></div>
<section class="card up"><h2>تعديل بياناتي</h2><form id="pf"><label>الاسم الكامل<input id="fn" value="${esc(name)}" autocomplete="name"></label>
<label>الصف الدراسي<select id="fg"><option value="">غير محدد</option>${grades.map(g=>`<option value="${g.id}" ${g.id==f.grade?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
<label>هدف المذاكرة اليومي (بالدقائق)<input id="fgo" type="number" min="5" max="600" step="5" value="${goal}"></label>
<div><b style="font-size:.9rem">الصورة الرمزية</b><div class="pick" id="pa" style="margin-block-start:.4rem">${AVS.map(a=>`<button type="button" data-a="${a}" aria-pressed="${a===f.av}" aria-label="${a}">${a}</button>`).join('')}</div>
<div class="pick cols" id="pc" style="margin-block-start:.5rem">${COLS.map(c=>`<button type="button" data-c="${c}" style="--c1:${c}" aria-pressed="${c===f.col}" aria-label="لون"></button>`).join('')}</div></div>
<p class="msg" id="m1" role="status"></p><button class="btn" id="sv">حفظ التعديلات</button></form></section>
<section class="card up"><h2>الأمان</h2><form id="pw"><label>كلمة سر جديدة<input id="np" type="password" minlength="6" autocomplete="new-password"></label><p class="msg" id="m2" role="status"></p><div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn" id="sp">تغيير كلمة السر</button><button type="button" class="btn g" id="out">تسجيل الخروج</button></div></form></section>`;
      requestAnimationFrame(()=>setTimeout(()=>{$('#rv').style.strokeDashoffset=327*(1-Math.min(1,tm/goal));document.querySelectorAll('[data-h]').forEach(e=>e.style.blockSize=e.dataset.h+'%');document.querySelectorAll('[data-w]').forEach(e=>e.style.inlineSize=e.dataset.w+'%')},60));
      let av=f.av,col=f.col;
      $('#pa').onclick=e=>{const b=e.target.closest('button');if(!b)return;av=b.dataset.a;[...$('#pa').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('.av').textContent=av};
      $('#pc').onclick=e=>{const b=e.target.closest('button');if(!b)return;col=b.dataset.c;[...$('#pc').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('.av').style.setProperty('--col',col)};
      $('#pf').onsubmit=async e=>{e.preventDefault();const m=$('#m1'),fn=$('#fn').value.trim(),b=$('#sv');m.className='msg';
        if(fn.length<2){m.className='msg e';return m.textContent='اكتب اسمك (حرفان على الأقل)'}
        b.disabled=true;m.textContent='جارٍ الحفظ…';
        LS('el_profile',{av,col,grade:$('#fg').value,goal:Math.min(600,Math.max(5,+$('#fgo').value||30))});
        let ok=false;try{const r=await T(sb.auth.updateUser({data:{full_name:fn}}));if(!r.error)ok=true}catch(x){console.warn(x)}
        try{const r=await T(sb.from('profiles').update({full_name:fn}).eq('id',u.id));if(!r.error)ok=true;else console.warn(r.error)}catch(x){console.warn(x)}
        b.disabled=false;if(!ok){m.className='msg e';return m.textContent='حفظنا الصورة والهدف، لكن تعذّر حفظ الاسم. حاول مرة أخرى'}
        prof.full_name=fn;meta.full_name=fn;draw();$('#m1').className='msg o';$('#m1').textContent='تم الحفظ ✓'};
      $('#pw').onsubmit=async e=>{e.preventDefault();const m=$('#m2'),pw=$('#np').value,b=$('#sp');m.className='msg';
        if(pw.length<6){m.className='msg e';return m.textContent='كلمة السر 6 أحرف على الأقل'}
        b.disabled=true;try{const r=await T(sb.auth.updateUser({password:pw}));if(r.error)throw r.error;$('#np').value='';m.className='msg o';m.textContent='تم تغيير كلمة السر ✓'}catch(x){m.className='msg e';m.textContent=x.message==='TIMEOUT'?'انتهت المهلة، حاول مرة أخرى':(x.message||'تعذّر التغيير')}b.disabled=false};
      $('#out').onclick=async()=>{try{await sb.auth.signOut()}catch(x){console.warn(x)}location.href='index.html'};
    }
  }
}
</script>
</body>
</html>
