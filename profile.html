    let run=null,sess=0;
    const tick=()=>{sess++;const p=P(),k=dkey();p.secs++;(p.by=p.by||{})[k]=(p.by[k]||0)+1;if(!p.days.includes(k))p.days.push(k);LS(PK,p);const e=$('#tm');if(e)e.textContent=fmt(sess);const t=$('#tTot');if(t)t.textContent=dur(p.secs)};
    const streak=p=>{let n=0,d=new Date();while(p.days.includes(dkey(d))){n++;d.setDate(d.getDate()-1)}return n};

<label>الصف الدراسي<select id="fg"><option value="">اختر صفّك…</option>${grades.map(g=>`<option value="${g.id}" ${g.id==prof.grade_id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
<label>هدف المذاكرة اليومي (بالدقائق)<input id="fgo" type="number" min="5" max="600" step="5" value="${goal}"></label>
<div><b style="font-size:.9rem">الصورة الرمزية</b><div class="pick" id="pa" style="margin-block-start:.4rem">${AVS.map((a,i)=>`<button type="button" data-a="${a}" aria-pressed="${a===f.av}" aria-label="أيقونة ${AR(i+1)}"><svg class="ic" width="26" height="26"><use href="#i-${a}"/></svg></button>`).join('')}</div>
<div class="pick cols" id="pc" style="margin-block-start:.5rem">${COLS.map(c=>`<button type="button" data-c="${c}" style="--c1:${c}" aria-pressed="${c===f.col}" aria-label="لون"></button>`).join('')}</div></div>
<p class="msg" id="m1" role="status"></p><button class="btn" id="sv">حفظ التعديلات</button></form></section>
<section class="card up"><h2>الأمان</h2><form id="pw"><label>كلمة سر جديدة<input id="np" type="password" minlength="8" autocomplete="new-password"></label><p class="msg" id="m2" role="status"></p><div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn" id="sp">تغيير كلمة السر</button><button type="button" class="btn g" id="out">تسجيل الخروج</button></div></form></section></div>`;
      $$('[data-tb]').forEach(b=>b.onclick=()=>showTab(b.dataset.tb));showTab(tab);
      requestAnimationFrame(()=>setTimeout(()=>{$('#rv').style.strokeDashoffset=327*(1-Math.min(1,tm/goal));$$('[data-h]').forEach(e=>e.style.blockSize=e.dataset.h+'%');$$('[data-w]').forEach(e=>e.style.inlineSize=e.dataset.w+'%')},60));
      $('#tmBtn').onclick=()=>{if(run){clearInterval(run);run=null;$('#tmBtn').textContent='متابعة الجلسة'}else{run=setInterval(tick,1000);$('#tmBtn').textContent='إيقاف مؤقت'}};
      $('#tmReset').onclick=()=>{clearInterval(run);run=null;sess=0;$('#tm').textContent='00:00:00';$('#tmBtn').textContent='بدء جلسة مذاكرة';draw()};
      let av=f.av,col=f.col;
      $('#pa').onclick=e=>{const b=e.target.closest('button');if(!b)return;av=b.dataset.a;[...$('#pa').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('.av use').setAttribute('href','#i-'+av)};
      $('#pc').onclick=e=>{const b=e.target.closest('button');if(!b)return;col=b.dataset.c;[...$('#pc').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('.av').style.setProperty('--col',col)};
      $('#pf').onsubmit=async e=>{e.preventDefault();const m=$('#m1'),fn=$('#fn').value.trim().replace(/\s+/g,' '),gr=+$('#fg').value,b=$('#sv');m.className='msg';
        if(fn.length<3){m.className='msg e';return m.textContent='اكتب اسمك الكامل (٣ أحرف على الأقل)'}
        if(!gr){m.className='msg e';return m.textContent='اختر صفّك الدراسي'}
        b.disabled=true;m.textContent='جارٍ الحفظ…';
        LS('el_profile',{av,col,goal:Math.min(600,Math.max(5,+$('#fgo').value||30))});
        try{const r=await T(sb.rpc('save_my_profile',{p_name:fn,p_grade_id:gr}));if(r.error)throw r.error;
          prof.full_name=fn;prof.grade_id=gr;draw();$('#m1').className='msg o';$('#m1').textContent='تم حفظ اسمك وصفّك'}
        catch(x){console.error('[ilogia profile save]',x);b.disabled=false;m.className='msg e';m.textContent=/Could not find the function|PGRST202/.test(String(x.message))?'حفظ البيانات غير مفعّل على الخادم بعد. تواصل مع إدارة المنصة.':x.message==='TIMEOUT'?'انتهت المهلة، حاول مرة أخرى':'تعذّر الحفظ، حاول مرة أخرى'}};
      $('#pw').onsubmit=async e=>{e.preventDefault();const m=$('#m2'),pw=$('#np').value,b=$('#sp');m.className='msg';
        if(pw.length<8){m.className='msg e';return m.textContent='كلمة السر ٨ أحرف على الأقل'}
        b.disabled=true;try{const r=await T(sb.auth.updateUser({password:pw}));if(r.error)throw r.error;$('#np').value='';m.className='msg o';m.textContent='تم تغيير كلمة السر'}catch(x){m.className='msg e';m.textContent=x.message==='TIMEOUT'?'انتهت المهلة، حاول مرة أخرى':(x.message||'تعذّر التغيير')}b.disabled=false};
      $('#out').onclick=async()=>{try{await sb.auth.signOut()}catch(x){console.warn(x)}location.replace('login.html')};
    }
    if(!redirected&&!loadFailed)draw();
    addEventListener('hashchange',()=>{if($('#tab-home'))showTab((location.hash||'#home').slice(1))});
  }
}
</script>
</body>
</html>
